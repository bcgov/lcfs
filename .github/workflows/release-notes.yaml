name: Update Release Notes JSON

# The Release Notes page reads frontend/public/release-notes.json, which is a
# static asset baked into the frontend image at build time. The image for a
# release is built by prod-ci from `main` the moment the release-vX.Y.Z PR
# merges — before the GitHub release is published. Generating notes on
# `release: published` therefore always lands too late for that build.
#
# So the primary path runs on pushes to a release branch: the entry is written
# while the release branch is still open, merges to main with the rest of the
# release, and is present in the tree the prod image is built from.
#
# The `release` trigger is kept as a safety net for releases published without a
# release branch, and for edits to existing releases. It never pushes to main
# (which is a locked, PR-only branch) — it opens a pull request instead.

on:
  push:
    branches:
      - "release-v*"
    # Prevents this workflow from re-triggering itself on its own commit.
    paths-ignore:
      - "frontend/public/release-notes.json"
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Semantic release tag to (re)generate notes for (e.g. v1.3.5)"
        required: true

permissions:
  contents: write # Push the release-branch commit / the pull-request branch
  pull-requests: write # Open the fallback pull request against main
  models: read # Call the GitHub Models API for the plain-English summary

concurrency:
  group: release-notes-json-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-release-notes-json:
    name: Update release-notes.json
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Resolve release tag and publish mode
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          BRANCH_REF: ${{ github.ref_name }}
        run: |
          # mode=branch → commit straight back to the open release branch.
          # mode=pr     → commit to a bot branch and open a PR against main.
          case "$EVENT_NAME" in
            push)
              RAW="${BRANCH_REF#release-}"
              TAG="v${RAW#v}"
              MODE="branch"
              BASE_REF="$BRANCH_REF"
              ;;
            release)
              TAG="$EVENT_TAG"
              MODE="pr"
              BASE_REF="main"
              ;;
            *)
              TAG="$INPUT_TAG"
              MODE="pr"
              BASE_REF="main"
              ;;
          esac

          if [ -z "$TAG" ]; then
            echo "No tag resolved from event or input — nothing to do."
            echo "is_semantic=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=${TAG}"           >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}"         >> "$GITHUB_OUTPUT"
          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"

          # Only named semantic version tags (vX.Y.Z or X.Y.Z) drive the page.
          if echo "$TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_semantic=true" >> "$GITHUB_OUTPUT"
            echo "display=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "✅ ${TAG} is a semantic release — will update release-notes.json (mode: ${MODE})"
          else
            echo "is_semantic=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ ${TAG} is not a semantic version tag — skipping."
          fi

      - name: Check out repository
        if: steps.tag.outputs.is_semantic == 'true'
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0 # Full history + all tags required
          ref: ${{ steps.tag.outputs.base_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        if: steps.tag.outputs.is_semantic == 'true'
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "20"

      - name: Prepare working branch
        id: branch
        if: steps.tag.outputs.is_semantic == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          MODE: ${{ steps.tag.outputs.mode }}
        run: |
          if [ "$MODE" = "branch" ]; then
            # Already on the release branch — commit directly to it.
            echo "work_branch=${{ steps.tag.outputs.base_ref }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PR mode: reuse the existing bot branch if one is already open for
          # this tag so the update fast-forwards instead of needing a force push.
          WORK_BRANCH="chore/release-notes-${TAG}"
          if git ls-remote --exit-code --heads origin "$WORK_BRANCH" >/dev/null 2>&1; then
            echo "Reusing existing branch ${WORK_BRANCH}"
            git fetch origin "$WORK_BRANCH"
            git checkout -B "$WORK_BRANCH" "origin/${WORK_BRANCH}"
          else
            echo "Creating branch ${WORK_BRANCH}"
            git checkout -b "$WORK_BRANCH"
          fi
          echo "work_branch=${WORK_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Resolve previous semantic tag
        id: prev
        if: steps.tag.outputs.is_semantic == 'true'
        env:
          LATEST_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git fetch --tags --quiet
          # Highest semantic tag strictly *below* the one being released, so a
          # hotfix on an older line diffs against the right baseline rather than
          # against whatever the newest tag in the repo happens to be.
          git tag -l \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | while read -r t; do printf '%s\t%s\n' "${t#v}" "$t"; done \
            | sort -V -k1,1 > /tmp/semantic-tags.tsv
          PREVIOUS_TAG=$(awk -F'\t' -v cur="${LATEST_TAG#v}" \
            '$1 == cur { exit } { print $2 }' /tmp/semantic-tags.tsv | tail -1)
          echo "previous=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"
          echo "Previous semantic tag: ${PREVIOUS_TAG:-<none>}"

          # A release that was deployed but never tagged silently widens the next
          # release's diff, so make that loud rather than letting it pass.
          LATEST_IN_JSON=$(node -e "
            const fs = require('fs');
            try {
              const entries = JSON.parse(fs.readFileSync('frontend/public/release-notes.json', 'utf8'));
              const previous = entries.find((e) => e.tag !== '${LATEST_TAG}');
              process.stdout.write(previous ? previous.tag : '');
            } catch { process.stdout.write(''); }
          ")
          if [ -n "$LATEST_IN_JSON" ] && [ "$LATEST_IN_JSON" != "$PREVIOUS_TAG" ]; then
            echo "::warning::release-notes.json's newest previous entry is ${LATEST_IN_JSON} but the newest git tag below ${LATEST_TAG} is ${PREVIOUS_TAG:-<none>}. If ${LATEST_IN_JSON} was released without pushing its tag, these notes will repeat content already published for it."
          fi

      - name: Generate native release notes
        id: native
        if: steps.tag.outputs.is_semantic == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const latestTag   = '${{ steps.tag.outputs.tag }}'
            const previousTag = '${{ steps.prev.outputs.previous }}'
            const mode        = '${{ steps.tag.outputs.mode }}'
            const baseRef     = '${{ steps.tag.outputs.base_ref }}'

            const params = {
              owner: context.repo.owner,
              repo:  context.repo.repo,
              tag_name: latestTag
            }
            if (previousTag) params.previous_tag_name = previousTag
            // In branch mode the tag does not exist yet — point the API at the
            // release branch so it can generate notes for the pending release.
            if (mode === 'branch') params.target_commitish = baseRef

            const { data } = await github.rest.repos.generateReleaseNotes(params)
            fs.writeFileSync('/tmp/native-notes.md', data.body)
            core.info(`✅ Native release notes generated (${latestTag} vs ${previousTag || 'repo start'})`)

      - name: Enhance with GitHub Models
        id: enhanced
        if: steps.tag.outputs.is_semantic == 'true'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs')
            const nativeNotes = fs.readFileSync('/tmp/native-notes.md', 'utf8')

            const SYSTEM_PROMPT = [
              'You are a technical writer for the BC Government Low Carbon Fuel Standard (LCFS) web application.',
              'Rewrite the provided GitHub-generated release notes into clear, professional language for a BC Government website.',
              'The audience is fuel suppliers, compliance officers, and ministry staff — not developers.',
              'Preserve the original ## category headings (🚀 New Features, 🐛 Bug Fixes, etc.).',
              'Rewrite each bullet point in plain English. Remove GitHub-specific syntax such as "by @user in #PR".',
              'Never name a specific fuel supplier or organization.',
              'Keep each item concise (one sentence). Return only the formatted markdown — no preamble or explanation.'
            ].join(' ')

            try {
              const response = await fetch(
                'https://models.github.ai/inference/chat/completions',
                {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    Accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28',
                    Authorization: `Bearer ${process.env.GITHUB_TOKEN}`
                  },
                  body: JSON.stringify({
                    model: 'openai/gpt-4o-mini',
                    messages: [
                      { role: 'system', content: SYSTEM_PROMPT },
                      { role: 'user',   content: nativeNotes }
                    ],
                    max_tokens: 2000,
                    temperature: 0.3
                  })
                }
              )

              if (!response.ok) {
                const body = await response.text()
                core.warning(`GitHub Models API ${response.status}: ${body.slice(0, 200)} — falling back to native notes`)
                fs.writeFileSync('/tmp/enhanced-notes.md', nativeNotes)
                return
              }

              const json     = await response.json()
              const enhanced = json.choices?.[0]?.message?.content
              if (!enhanced) {
                core.warning('Empty response from GitHub Models — falling back to native notes')
                fs.writeFileSync('/tmp/enhanced-notes.md', nativeNotes)
                return
              }

              core.info('✅ Plain-English summary generated')
              fs.writeFileSync('/tmp/enhanced-notes.md', enhanced)
            } catch (err) {
              core.warning(`GitHub Models API unavailable: ${err.message} — falling back to native notes`)
              fs.writeFileSync('/tmp/enhanced-notes.md', nativeNotes)
            }

      - name: Update release-notes.json
        if: steps.tag.outputs.is_semantic == 'true'
        run: |
          node scripts/build-release-notes.mjs \
            --tag             "${{ steps.tag.outputs.tag }}" \
            --display-version "${{ steps.tag.outputs.display }}" \
            --native-notes    /tmp/native-notes.md \
            --enhanced-notes  /tmp/enhanced-notes.md

      - name: Commit and push release-notes.json
        id: commit
        if: steps.tag.outputs.is_semantic == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          WORK_BRANCH: ${{ steps.branch.outputs.work_branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/release-notes.json
          if git diff --staged --quiet; then
            echo "release-notes.json unchanged — nothing to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(release): update release notes for ${TAG}"

          # Rebase-and-retry to avoid non-fast-forward failures if the branch moved
          for attempt in 1 2 3; do
            if git push origin "HEAD:${WORK_BRANCH}"; then
              echo "✅ release-notes.json pushed to ${WORK_BRANCH}"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}) — rebasing on latest ${WORK_BRANCH} and retrying"
            git fetch origin "${WORK_BRANCH}"
            git rebase "origin/${WORK_BRANCH}" || { git rebase --abort; exit 1; }
          done
          echo "::error::Failed to push release-notes.json after 3 attempts"
          exit 1

      - name: Open pull request against main
        if: steps.tag.outputs.is_semantic == 'true' && steps.tag.outputs.mode == 'pr' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          WORK_BRANCH: ${{ steps.branch.outputs.work_branch }}
        run: |
          if gh pr view "$WORK_BRANCH" --json number --jq .number >/dev/null 2>&1; then
            echo "ℹ️ Pull request for ${WORK_BRANCH} already open — new commit pushed to it."
            exit 0
          fi
          gh pr create \
            --base  main \
            --head  "$WORK_BRANCH" \
            --title "chore(release): update release notes for ${TAG}" \
            --body  "$(cat <<EOF
          Adds the \`${TAG}\` entry to \`frontend/public/release-notes.json\`.

          Opened automatically because \`${TAG}\` was released without the entry being
          generated on its release branch. \`main\` is a locked, PR-only branch, so this
          cannot be pushed directly.

          Note: the Release Notes page serves this file as a static asset baked into the
          frontend image, so the entry appears once an image is built from \`main\` after
          this merges.
          EOF
          )"
          echo "✅ Pull request opened for ${WORK_BRANCH}"

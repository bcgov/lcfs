services:
  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcfs -d lcfs"]
      interval: 2s
      timeout: 3s
      retries: 30

  metabase:
    image: metabase/metabase:v0.65.6
    restart: unless-stopped
    ports:
      - "${LCFS_METABASE_PUBLISHED_PORT:-3001}:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_LOAD_SAMPLE_CONTENT: "false"
      MB_SITE_URL: http://localhost:${LCFS_METABASE_PUBLISHED_PORT:-3001}
    networks:
      - shared_network

  metabase_setup:
    image: python:3.13-alpine
    restart: "no"
    depends_on:
      metabase:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      METABASE_URL: http://metabase:3000
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@lcfs.local}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:-LocalMetabase123!}
      METABASE_ADMIN_FIRST_NAME: ${METABASE_ADMIN_FIRST_NAME:-Local}
      METABASE_ADMIN_LAST_NAME: ${METABASE_ADMIN_LAST_NAME:-Administrator}
    volumes:
      - ./scripts/setup_metabase.py:/setup_metabase.py:ro
    entrypoint: ["python", "/setup_metabase.py"]
    networks:
      - shared_network

volumes:
  metabase_data: {}

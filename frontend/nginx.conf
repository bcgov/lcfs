# Based on https://www.nginx.com/resources/wiki/start/topics/examples/full/#nginx-conf
# user              www www;  ## Default: nobody

# OpenShift runs this image with an arbitrary non-root UID, so the pid and temp
# files live under /tmp and the logs go to stdout/stderr.
worker_processes  auto;
error_log         /dev/stderr;
pid               /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    log_format    main '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';
    access_log    /dev/stdout main;
    add_header    X-Frame-Options SAMEORIGIN always;

    # Security headers (LCFS-SEC-024). Applied at the http level so they are
    # inherited by every server/location block, including error responses.
    #
    # script-src intentionally omits 'unsafe-inline'/'unsafe-eval'; the SPA
    # only loads first-party, hashed module scripts. style-src keeps
    # 'unsafe-inline' because MUI/emotion inject <style> tags at runtime
    # without a nonce. connect-src/form-action/frame-src allow the BC Gov
    # Keycloak/logon domains used for SSO across all environments, plus the
    # map tile/marker and flag-icon CDNs used by the leaflet map views.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com https://raw.githubusercontent.com https://flagcdn.com; connect-src 'self' https://*.gov.bc.ca https://*.apps.silver.devops.gov.bc.ca; frame-src 'self' https://*.gov.bc.ca; frame-ancestors 'self'; form-action 'self' https://*.gov.bc.ca" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

    client_body_temp_path  /tmp/client_body 1 2;
    proxy_temp_path        /tmp/proxy 1 2;
    fastcgi_temp_path      /tmp/fastcgi 1 2;
    scgi_temp_path         /tmp/scgi 1 2;
    uwsgi_temp_path        /tmp/uwsgi 1 2;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        off;
    gzip               on;
    gzip_http_version  1.0;
    gzip_comp_level    2;
    gzip_proxied       any;
    gzip_types         text/plain text/css application/javascript text/xml application/xml+rss;
    keepalive_timeout  65;
    ssl_protocols      TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    client_max_body_size 80M;
    server_tokens off;

    absolute_redirect  off;
    port_in_redirect   off;

    # HTTP Server
    server {
        # Port to listen on, can also be set in IP:PORT format
        listen  8080;
        root    /app;

        # Deny all attempts to access hidden files such as .htaccess or .htpasswd
        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri /index.html;
        }

        location /status {
            stub_status on;
            access_log   off;
            allow 127.0.0.1;
            deny all;
        }
    }
}
